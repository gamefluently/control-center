<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f2efe8" />
  <title>Control Center</title>
  <link rel="stylesheet" href="styles.css?v=simple-1" />
</head>
<body>
  <div class="app-shell board-shell">
    <main class="board-main">
      <section id="dashboardView">
        <div class="board-header">
          <div>
            <div class="eyebrow">CONTROL CENTER</div>
            <h1>Project Board</h1>
            <p class="hero-copy">Where everything stands and what happens next.</p>
          </div>
          <div id="lastUpdated" class="last-updated"></div>
        </div>

        <section class="projects-section">
          <div class="section-heading board-section-heading">
            <div>
              <div class="eyebrow">PROJECTS</div>
              <h2>Current work</h2>
            </div>
            <div id="projectCount" class="project-count"></div>
          </div>
          <div id="projectList" class="project-list"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="control-center-state.js?v=simple-1"></script>
  <script src="app.js?v=simple-1"></script>
</body>
</html>
